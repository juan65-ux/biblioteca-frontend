<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Biblioteca — Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ── SIDEBAR ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="icon-biblioteca">
        <img src="img/LOGO-SENA.jpg" alt="Logo SENA" class="sidebar-logo-img" />
      </div>
      <h4>Biblioteca SENA</h4>
      <p>Sistema de Gestión</p>
    </div>
    <nav>
      <a href="index.html">
        <span class="icono">
          <img src="img/logo-dashboard.png" alt="Dashboard" class="sidebar-icon-img" />
        </span>Dashboard
      </a>
      <a href="equipos.html">
        <span class="icono">
          <img src="img/logo-equipos.png" alt="Equipos" class="sidebar-icon-img" />
        </span>Equipos
      </a>
      <a href="prestamos.html">
        <span class="icono">
          <img src="img/logo-prestamos.png" alt="Préstamos" class="sidebar-icon-img" />
        </span>Préstamos
      </a>
      <a href="prestamos-aprendices.html">
        <span class="icono">
          <img src="img/logo-prestamos.png" alt="Préstamos Aprendices" class="sidebar-icon-img" />
        </span>Préstamos Aprendices
      </a>
      <a href="reservas.html">
        <span class="icono">
          <img src="img/logo-calendario.png" alt="Reservas de Sala" class="sidebar-icon-img" />
        </span>Reservas de Sala
      </a>
      <a href="usuarios.html" class="activo">
        <span class="icono">
          <img src="img/logo-dashboard.png" alt="Usuarios" class="sidebar-icon-img" />
        </span>Usuarios
      </a>
      <a href="#" onclick="cerrarSesionAdmin()">
        <span class="icono">
          <img src="img/icon-cerrarsecion.png" alt="Cerrar Sesión" class="sidebar-icon-img" />
        </span>Cerrar Sesión
      </a>
    </nav>
  </aside>

  <!-- ── CONTENIDO PRINCIPAL ─────────────────────────────── -->
  <main class="contenido-principal admin-page">

    <header class="admin-page-hero">
      <div class="admin-page-hero-text">
        <h1>Gestión de usuarios</h1>
        <p>Administra los usuarios del sistema</p>
      </div>
      <div class="admin-page-hero-actions">
        <button type="button" class="btn btn-primary" onclick="abrirModalCrear()">+ Nuevo usuario</button>
      </div>
    </header>

    <!-- Tabla de usuarios -->
    <div class="card-custom admin-section-card">
      <div class="card-header-custom">
        <h5>Lista de usuarios</h5>
        <span id="contador-usuarios" class="admin-meta"></span>
      </div>
      <div id="contenedor-usuarios">
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando usuarios...</p>
        </div>
      </div>
    </div>

  </main>

  <!-- ── MODAL CREAR USUARIO ─────────────────────── -->
  <div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content modal-sena">

        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="titulo-modal">Nuevo Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label fw-semibold">
              Nombre Completo <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="usuario-nombre"
              placeholder="Ej: Juan Pérez"
            />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">
              Documento de Identidad <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="usuario-documento"
              placeholder="Ej: 1000123456"
            />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">
              Contraseña <span class="text-danger">*</span>
            </label>
            <input
              type="password"
              class="form-control"
              id="usuario-contrasena"
              placeholder="Mínimo 6 caracteres"
            />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">
              Dependencia <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="usuario-dependencia"
              placeholder="Ej: Análisis y Desarrollo de Software"
            />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">
              Rol <span class="text-danger">*</span>
            </label>
            <select class="form-select" id="usuario-rol">
              <option value="usuario" selected>Usuario Normal</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary" onclick="guardarUsuario()">
            Crear Usuario
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    // ── VERIFICAR SESIÓN ADMIN ───────────────────────────────
    const token = sessionStorage.getItem('token');
    const usuarioData = sessionStorage.getItem('usuario');
    if (!token || !usuarioData) { window.location.href = 'login.html'; throw new Error('Sin sesión'); }
    const usuarioActual = JSON.parse(usuarioData);
    if (usuarioActual.rol !== 'admin') { window.location.href = 'usuario/index.html'; throw new Error('No es admin'); }

    const cerrarSesionAdmin = () => {
      if (confirm('¿Estás seguro que deseas cerrar sesión?')) {
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('usuario');
        window.location.href = 'login.html';
      }
    };

    // ── CARGAR Y RENDERIZAR USUARIOS ──────────────────────────
    const cargarUsuarios = async () => {
      const contenedor = document.getElementById('contenedor-usuarios');
      contenedor.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando usuarios...</p>
        </div>`;

      try {
        const respuesta = await usuariosAPI.listar();
        const usuarios = respuesta.data;

        document.getElementById('contador-usuarios').textContent =
          `${respuesta.total} usuario(s) registrado(s)`;

        if (usuarios.length === 0) {
          contenedor.innerHTML = `
            <div class="estado-vacio">
              <div class="icono-vacio">📭</div>
              <p>No hay usuarios registrados</p>
            </div>`;
          return;
        }

        contenedor.innerHTML = `
          <table class="tabla-custom">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Documento</th>
                <th>Dependencia</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${usuarios.map(u => `
                <tr>
                  <td><strong>${u.nombreCompleto}</strong></td>
                  <td><code>${u.documento}</code></td>
                  <td>${u.dependencia}</td>
                  <td>${u.rol === 'admin' ? '<span class="badge bg-primary text-white">Admin</span>' : '<span class="badge bg-secondary text-white">Usuario</span>'}</td>
                  <td>
                    ${u.activo 
                      ? '<span class="badge bg-success text-white">Activo</span>' 
                      : '<span class="badge bg-danger text-white">Inactivo</span>'}
                  </td>
                  <td>
                    <button
                      class="btn btn-sm ${u.activo ? 'btn-outline-danger' : 'btn-outline-success'}"
                      onclick="cambiarEstado('${u._id}', ${!u.activo})"
                      title="${u.activo ? 'Desactivar usuario' : 'Activar usuario'}"
                    >
                      ${u.activo ? 'Desactivar' : 'Activar'}
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;

      } catch (error) {
        contenedor.innerHTML = `
          <div class="estado-vacio">
            <div class="icono-vacio">❌</div>
            <p>Error al cargar los usuarios. ¿Está el servidor corriendo?</p>
          </div>`;
      }
    };

    // ── ABRIR MODAL PARA CREAR ───────────────────────────────
    const abrirModalCrear = () => {
      document.getElementById('usuario-nombre').value = '';
      document.getElementById('usuario-documento').value = '';
      document.getElementById('usuario-contrasena').value = '';
      document.getElementById('usuario-dependencia').value = '';
      document.getElementById('usuario-rol').value = 'usuario';

      new bootstrap.Modal(document.getElementById('modalUsuario')).show();
    };

    // ── CREAR USUARIO ─────────────────────────────────────────
    const guardarUsuario = async () => {
      const nombreCompleto = document.getElementById('usuario-nombre').value.trim();
      const documento = document.getElementById('usuario-documento').value.trim();
      const contrasena = document.getElementById('usuario-contrasena').value;
      const dependencia = document.getElementById('usuario-dependencia').value.trim();
      const rol = document.getElementById('usuario-rol').value;

      if (!nombreCompleto || !documento || !contrasena || !dependencia) {
        mostrarNotificacion('Por favor completa todos los campos obligatorios', 'advertencia');
        return;
      }

      if (contrasena.length < 6) {
        mostrarNotificacion('La contraseña debe tener mínimo 6 caracteres', 'advertencia');
        return;
      }

      try {
        await usuariosAPI.crear({ nombreCompleto, documento, contrasena, dependencia, rol });
        mostrarNotificacion('Usuario creado correctamente', 'exito');
        
        bootstrap.Modal.getInstance(document.getElementById('modalUsuario')).hide();
        cargarUsuarios();

      } catch (error) {
        mostrarNotificacion(error.message, 'error');
      }
    };

    // ── CAMBIAR ESTADO ───────────────────────────────────────
    const cambiarEstado = async (id, activo) => {
      const accion = activo ? 'activar' : 'desactivar';
      if (!confirm(`¿Estás seguro de que deseas ${accion} este usuario?`)) return;

      try {
        await usuariosAPI.cambiarEstado(id, activo);
        mostrarNotificacion(`Usuario ${activo ? 'activado' : 'desactivado'} correctamente`, 'exito');
        cargarUsuarios();
      } catch (error) {
        mostrarNotificacion(error.message, 'error');
      }
    };

    cargarUsuarios();

    // ── AUTO-REFRESH CADA 15 SEGUNDOS ────────────────────────
    setInterval(cargarUsuarios, 15000);

  </script>

</body>
</html>
